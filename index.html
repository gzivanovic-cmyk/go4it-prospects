<title>GO 4IT Prospects</title><link rel="icon" href="assets/logo.svg">
<style>
:root{--acc:#3346D3;--accbg:#3346D3;--acc2:#22C38E;--bg:#F5F5F7;--card:rgba(255,255,255,.78);--solid:#fff;--ink:#1D1D1F;--ink2:#5F5F64;--ink3:#69696E;--gtxt:#0F7550;--rtxt:#C4281C;--otxt:#A35A00;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);--r:18px;--ease:cubic-bezier(.25,.1,.25,1);--red:#FF3B30;--orange:#FF9500;--green:#34C759;--yellow:#FFCC00}
@media (prefers-color-scheme:dark){:root{--acc:#8A97FF;--accbg:#4A5AE0;--bg:#000;--card:rgba(28,28,30,.72);--solid:#1C1C1E;--ink:#F5F5F7;--ink2:#98989D;--ink3:#A0A0A6;--gtxt:#4CD9A0;--rtxt:#FF6961;--otxt:#FFB340;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35)}.wm{filter:invert(1)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 20% 0%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent),var(--bg)}
.lbox{width:100%;max-width:380px;text-align:center;animation:rise .6s var(--ease)}
.lbox .ic{width:64px;height:64px;border-radius:16px;box-shadow:var(--sh)}.lbox .wm{height:20px;margin-top:18px}
.lbox h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:26px 0 6px}.lbox p{color:var(--ink2);margin:0 0 26px}
.pw{display:flex;background:var(--card);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--sh);transition:.2s}
.pw:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.pw input{flex:1;border:0;background:none;outline:none;padding:12px 14px;font-size:16px;min-width:0}
.pw button{border:0;border-radius:10px;background:var(--accbg);color:#fff;width:44px;cursor:pointer;display:grid;place-items:center;transition:.2s}.pw button:active{transform:scale(.94)}
.err{color:var(--rtxt);font-size:13px;min-height:20px;margin-top:12px}.lock{font-size:12px;color:var(--ink3);margin-top:28px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hin{max-width:1600px;margin:auto;padding:10px clamp(16px,4vw,48px);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}.brand img.ic{width:28px;height:28px;border-radius:7px}.brand .wm{height:13px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;position:relative;gap:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);white-space:nowrap;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.seg button.on{background:var(--solid);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}.upd{font-size:12px;color:var(--ink2)}
.ib{border:0;background:var(--fill);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:.2s}.ib:hover{background:var(--line)}
main{max-width:1600px;margin:auto;padding:36px clamp(16px,4vw,48px) 80px;animation:fade .5s var(--ease)}
.hero h2{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.08}.hero p{color:var(--ink2);font-size:17px;margin:8px 0 28px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);cursor:pointer;text-align:left;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.08)}.kpi.on{box-shadow:0 0 0 2px var(--acc),var(--sh)}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500}.kpi .n{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.1}.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;position:relative}.search input{width:100%;padding:10px 14px 10px 38px;border:0;border-radius:12px;background:var(--fill);outline:none;font-size:15px;transition:.2s}.search input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.tools select{border:0;border-radius:10px;background:var(--fill);padding:8px 12px;font-size:13px;outline:none;cursor:pointer}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}.fl .lab{font-size:12px;color:var(--ink2);margin-right:-4px}
.count{font-size:13px;color:var(--ink2);margin-left:auto}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease);animation:rise .45s var(--ease) both;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px) scale(1.005);box-shadow:0 4px 8px rgba(0,0,0,.04),0 20px 50px rgba(0,0,0,.1)}
.thumb{aspect-ratio:16/10;background:var(--fill);position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .6s var(--ease)}.card:hover .thumb img{transform:scale(1.03)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.nosite{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,var(--solid)),color-mix(in srgb,var(--acc2) 10%,var(--solid)))}
.nosite .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}.nosite .rv{font-size:13px;color:var(--ink2)}.nosite .none{font-size:12px;font-weight:600;color:var(--rtxt);background:color-mix(in srgb,var(--red) 12%,transparent);padding:3px 10px;border-radius:99px;margin-top:6px}
.stars{display:inline-flex;gap:1px;font-size:15px;letter-spacing:0}.stars .f{color:#FFB800}.stars .e{color:var(--ink3);opacity:.5}
.score{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--solid) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.score svg{position:absolute;inset:4px}.score b{font-size:15px;font-weight:700;position:relative}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ct{display:flex;gap:12px;align-items:center}.logo{width:36px;height:36px;border-radius:9px;background:var(--fill);flex:none;object-fit:contain;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink2)}
.ct h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ct .sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:6px}.b{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.b.acc{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}.b.red{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--rtxt)}.b.green{background:color-mix(in srgb,#22C38E 9%,transparent);color:var(--gtxt);font-weight:600}.b.orange{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--otxt)}.b.pink{background:color-mix(in srgb,#3346D3 12%,transparent);color:var(--acc)}
.why{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin:0}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:auto;padding-top:6px}.sb{font-size:10px;color:var(--ink3);text-align:center}.sb i{display:block;height:4px;border-radius:2px;background:var(--fill);margin-bottom:4px;overflow:hidden}.sb i span{display:block;height:100%;border-radius:2px}
/* table */
.tbl{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;font-weight:600;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--solid)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer;transition:background .2s}tbody tr:hover{background:var(--fill)}
.tthumb{width:72px;height:45px;border-radius:6px;object-fit:cover;object-position:top;background:var(--fill);display:block}
.empty{text-align:center;padding:80px 20px;color:var(--ink2)}

#dr{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:color-mix(in srgb,var(--solid) 88%,transparent);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);z-index:50;transform:translateX(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.15);border-left:1px solid var(--line)}#dr.on{transform:none}
.dh{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px;z-index:2}
.dc{padding:0 28px 40px;margin-top:-44px}.dshot{border-radius:14px;overflow:hidden;box-shadow:var(--sh);margin:44px 0 20px;background:var(--fill);position:relative}.dshot img{width:100%;display:block}

.audit{display:flex;gap:18px;align-items:center}.ring{width:84px;height:84px;position:relative;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700}
.bars{flex:1;display:grid;gap:7px}.bar{display:grid;grid-template-columns:72px 1fr 28px;gap:10px;align-items:center;font-size:13px}.bar i{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i span{display:block;height:100%;border-radius:3px;transition:width .8s var(--ease)}
.nl{display:inline-flex;align-items:center;gap:6px;background:var(--accbg);color:#fff!important;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:500;text-decoration:none!important;margin-top:4px}
.nl.g{background:var(--fill);color:var(--ink)!important}
/* docs */
.doc{max-width:860px;margin:auto}.doc h1{display:none}.doc h2{font-size:28px;letter-spacing:-.03em;margin:44px 0 12px}.doc h2:first-child{margin-top:0}.doc h3{font-size:19px;margin:28px 0 8px}
.doc p,.doc li{color:var(--ink);font-size:16px}.doc ul,.doc ol{padding-left:22px}.doc li{margin:6px 0}

.doc code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:13px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px;border-radius:10px}.card:focus-visible{outline-offset:3px;border-radius:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kbd{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.copy{border:0;border-radius:99px;background:var(--accbg);color:#fff;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;float:right;margin-top:-4px}
.pts{margin:0;padding-left:20px;font-size:14px}.pts li{margin:4px 0}
.top{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--gtxt);color:#fff;font-size:11px;font-weight:700;padding:0 6px}
.bar{grid-template-columns:110px 1fr 44px}
@media (max-width:720px){.brand .wm,.upd{display:none}.hin{gap:10px}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:14px}.kpi .n{font-size:26px}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.dc{padding:0 18px 40px}main{padding-top:24px}.tools select{flex:1}}

</style>
