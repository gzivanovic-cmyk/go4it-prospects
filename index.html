<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GO 4IT Prospects</title><link rel="icon" href="assets/logo.svg">
<style>
:root{--acc:#3346D3;--acc2:#22C38E;--bg:#F5F5F7;--card:rgba(255,255,255,.78);--solid:#fff;--ink:#1D1D1F;--ink2:#6E6E73;--ink3:#A1A1A6;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);--r:18px;--ease:cubic-bezier(.25,.1,.25,1);--red:#FF3B30;--orange:#FF9500;--green:#34C759;--yellow:#FFCC00}
@media (prefers-color-scheme:dark){:root{--acc:#6E7FFF;--bg:#000;--card:rgba(28,28,30,.72);--solid:#1C1C1E;--ink:#F5F5F7;--ink2:#98989D;--ink3:#636366;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35)}.wm{filter:invert(1)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 20% 0%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent),var(--bg)}
.lbox{width:100%;max-width:380px;text-align:center;animation:rise .6s var(--ease)}
.lbox .ic{width:64px;height:64px;border-radius:16px;box-shadow:var(--sh)}.lbox .wm{height:20px;margin-top:18px}
.lbox h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:26px 0 6px}.lbox p{color:var(--ink2);margin:0 0 26px}
.pw{display:flex;background:var(--card);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--sh);transition:.2s}
.pw:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}

.err{color:var(--red);font-size:13px;min-height:20px;margin-top:12px}.lock{font-size:12px;color:var(--ink3);margin-top:28px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hin{max-width:1600px;margin:auto;padding:10px clamp(16px,4vw,48px);display:flex;align-items:center;gap:16px}

.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;position:relative;gap:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);white-space:nowrap;transition:background .25s var(--ease),box-shadow .25s var(--ease)}

.hero h2{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.08}.hero p{color:var(--ink2);font-size:17px;margin:8px 0 28px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}

.search{flex:1 1 260px;position:relative}.search input{width:100%;padding:10px 14px 10px 38px;border:0;border-radius:12px;background:var(--fill);outline:none;font-size:15px;transition:.2s}.search input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.tools select{border:0;border-radius:10px;background:var(--fill);padding:8px 12px;font-size:13px;outline:none;cursor:pointer}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}.fl .lab{font-size:12px;color:var(--ink2);margin-right:-4px}
.count{font-size:13px;color:var(--ink2);margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease);animation:rise .45s var(--ease) both;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px) scale(1.005);box-shadow:0 4px 8px rgba(0,0,0,.04),0 20px 50px rgba(0,0,0,.1)}
.thumb{aspect-ratio:16/10;background:var(--fill);position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .6s var(--ease)}.card:hover .thumb img{transform:scale(1.03)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.nosite{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,var(--solid)),color-mix(in srgb,var(--acc2) 10%,var(--solid)))}
.nosite .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}.nosite .rv{font-size:13px;color:var(--ink2)}.nosite .none{font-size:12px;font-weight:600;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:3px 10px;border-radius:99px;margin-top:6px}
.stars{display:inline-flex;gap:1px;font-size:15px;letter-spacing:0}.stars .f{color:#FFB800}.stars .e{color:var(--ink3);opacity:.5}
.score{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--solid) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.score svg{position:absolute;inset:4px}.score b{font-size:15px;font-weight:700;position:relative}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ct{display:flex;gap:12px;align-items:center}.logo{width:36px;height:36px;border-radius:9px;background:var(--fill);flex:none;object-fit:contain;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink2)}
.ct h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ct .sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:6px}.b{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.b.acc{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}.b.red{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}.b.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:#1f9d45}.b.orange{background:color-mix(in srgb,var(--orange) 15%,transparent);color:#c76f00}.b.pink{background:color-mix(in srgb,#FF2D55 13%,transparent);color:#FF2D55}
.why{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;margin:0}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:auto;padding-top:6px}.sb{font-size:10px;color:var(--ink3);text-align:center}.sb i{display:block;height:4px;border-radius:2px;background:var(--fill);margin-bottom:4px;overflow:hidden}.sb i span{display:block;height:100%;border-radius:2px}
/* table */
.tbl{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;font-weight:600;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--solid)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer;transition:background .2s}tbody tr:hover{background:var(--fill)}
.tthumb{width:72px;height:45px;border-radius:6px;object-fit:cover;object-position:top;background:var(--fill);display:block}
.empty{text-align:center;padding:80px 20px;color:var(--ink2)}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:color-mix(in srgb,var(--solid) 88%,transparent);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);z-index:50;transform:translateX(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.15);border-left:1px solid var(--line)}#dr.on{transform:none}
.dh{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px;z-index:2}
.dc{padding:0 28px 40px;margin-top:-44px}.dshot{border-radius:14px;overflow:hidden;box-shadow:var(--sh);margin:44px 0 20px;background:var(--fill);position:relative}.dshot img{width:100%;display:block}
.dc h2{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px;line-height:1.15}.dc .sub{color:var(--ink2);margin-bottom:14px}
.sec{background:var(--fill);border-radius:14px;padding:16px 18px;margin-top:16px}.sec h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.txt{font-size:14px;white-space:pre-wrap;word-break:break-word;margin:0}.txt+h5{margin-top:12px}.sec h5{margin:0 0 4px;font-size:13px;font-weight:600}
.audit{display:flex;gap:18px;align-items:center}.ring{width:84px;height:84px;position:relative;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700}
.bars{flex:1;display:grid;gap:7px}.bar{display:grid;grid-template-columns:72px 1fr 28px;gap:10px;align-items:center;font-size:13px}.bar i{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i span{display:block;height:100%;border-radius:3px;transition:width .8s var(--ease)}
.nl{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff!important;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:500;text-decoration:none!important;margin-top:4px}
.nl.g{background:var(--fill);color:var(--ink)!important}
/* docs */
.doc{max-width:860px;margin:auto}.doc h1{display:none}.doc h2{font-size:28px;letter-spacing:-.03em;margin:44px 0 12px}.doc h2:first-child{margin-top:0}.doc h3{font-size:19px;margin:28px 0 8px}
.doc p,.doc li{color:var(--ink);font-size:16px}.doc ul,.doc ol{padding-left:22px}.doc li{margin:6px 0}
.doc table{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin:12px 0;font-size:14px}.doc td,.doc th{position:static;cursor:default}
.doc code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:13px}
@media (max-width:720px){.brand .wm,.upd{display:none}.hin{gap:10px}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:14px}.kpi .n{font-size:26px}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.dc{padding:0 18px 40px}main{padding-top:24px}.tools select{flex:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section id="login"><div class="lbox"><img class="ic" src="assets/logo.svg" alt=""><br><img class="wm" src="assets/wordmark.svg" alt="GO 4IT-Studio">

<script>
const $=id=>document.getElementById(id);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decrypt(pw){const r=await fetch('data/prospects.enc?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('net');const e=await r.json();
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))))}
$('lf').onsubmit=async ev=>{ev.preventDefault();const pw=$('pw').value;if(!pw)return;$('lerr').textContent='';$('lb').innerHTML='<span class="spin"></span>';
 try{const d=await decrypt(pw);sessionStorage.setItem('g4',pw);start(d)}catch(x){$('lerr').textContent=x.message==='net'?'Gegevens konden niet worden geladen.':'Onjuist wachtwoord.';$('lb').innerHTML='→';$('pw').select()}};
$('lo').onclick=()=>{sessionStorage.removeItem('g4');location.reload()};
let D,R=[],st={s:'all',p:'all',w:'all',q:'',sort:'rec',v:'c',k:null};
const OFF=['Afgewezen','Niet passend','Geen interesse'],BEN=['Benaderd','Gesprek','Offerte','Klant'],GOR=['Beoordeling Goran','Goedgekeurd','Goedgekeurd (Sjef)','Benaderen'];
const noSite=r=>['Nee','Alleen social/Linktree','Verlopen/kapot'].includes(r['Heeft website'])||(!r._domain&&r['Heeft website']!=='Ja');
const days=d=>d?(Date.now()-new Date(d))/864e5:1e9;const freshSig=r=>r['Laatste signaal']&&days(r['Datum laatste signaal'])<=30;
const date=r=>r['Onderzoeksdatum']||r['Datum verdieping Zoë']||'';
const fmt=d=>d?new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):'';
const col=v=>v==null?'var(--ink3)':v<50?'var(--red)':v<75?'var(--orange)':'var(--green)';const col10=v=>col(v*10);
const stars=(x)=>{const f=Math.round(x*2)/2;let s='';for(let i=1;i<=5;i++)s+=`<span class="${f>=i?'f':(f>=i-.5?'f':'e')}">${f>=i?'★':(f>=i-.5?'⯪':'★')}</span>`;return `<span class="stars" aria-label="${x} sterren">${s}</span>`};
const stBadge=s=>{if(!s)return'';const c=OFF.includes(s)?'':BEN.includes(s)?'green':GOR.includes(s)?'pink':s==='Terug naar Lucas'?'orange':'acc';return `<span class="b ${c}">${esc(s)}</span>`};
function ring(v,size=44,w=4){const r=(size-w)/2,c=2*Math.PI*r,p=v==null?0:Math.max(0,Math.min(100,v))/100;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col(v)}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
const SUBS=[['Audit snelheid','Snelheid'],['Audit mobiel','Mobiel'],['Audit SEO','SEO'],['Audit design','Design'],['Audit techniek','Techniek']];
function start(d){D=d;R=d.rows||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('upd').textContent='Bijgewerkt '+new Date(d.updated).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 $('docw').innerHTML=md(d.docs?.werkwijze||'');$('doch').innerHTML=md(d.docs?.hoe||'');kpis();render()}
function kpis(){const act=R.filter(r=>!OFF.includes(r.Status)),au=R.filter(r=>r['Audit score']!=null);
 const K=[['all','Totaal',R.length,`${act.length} actief`],['goran','Ter beoordeling',R.filter(r=>GOR.includes(r.Status)).length,'wacht op jouw besluit'],['A','Prioriteit A',R.filter(r=>r.Prioriteit==='A').length,'beste kansen'],['none','Zonder website',R.filter(noSite).length,'kans voor een eerste site'],['sig','Nieuw signaal',R.filter(freshSig).length,'laatste 30 dagen'],['audit','Gem. auditscore',au.length?Math.round(au.reduce((a,r)=>a+r['Audit score'],0)/au.length):'–',au.length?`${au.length} gemeten`:'audit volgt'],['ben','Benaderd',R.filter(r=>BEN.includes(r.Status)).length,'in gesprek of benaderd']];
 $('kpis').innerHTML=K.map(([k,l,n,s])=>`<button class="kpi${st.k===k?' on':''}" data-k="${k}"><div class="l">${l}</div><div class="n">${n}</div><div class="s">${s}</div></button>`).join('');
 $('sumline').textContent=`${R.length} bedrijven gevonden door Lucas, Zoë, Sjef en het team. Jij beslist wie je benadert.`;
 document.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{const k=b.dataset.k;st.k=st.k===k?null:k;
  st.s=st.p=st.w='all';if(st.k==='goran')st.s='goran';if(st.k==='ben')st.s='ben';if(st.k==='A')st.p='A';if(st.k==='none')st.w='none';if(st.k==='sig')st.w='sig';if(st.k==='audit')st.sort='audit',$('sort').value='audit';
  syncSeg();kpis();render()})}
function syncSeg(){[['fs','s'],['fp','p'],['fw','w']].forEach(([id,k])=>$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===st[k])))}
function seg(id,fn){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset)})}
seg('fs',d=>{st.s=d.v;st.k=null;kpis();render()});seg('fp',d=>{st.p=d.v;st.k=null;kpis();render()});seg('fw',d=>{st.w=d.v;st.k=null;kpis();render()});seg('view',d=>{st.v=d.v;render()});
seg('tabs',d=>{['p','w','h'].forEach(t=>$('v'+t).classList.toggle('hidden',t!==d.t));scrollTo({top:0,behavior:'smooth'})});
$('q').oninput=e=>{st.q=e.target.value.toLowerCase();render()};$('sort').onchange=e=>{st.sort=e.target.value;render()};
function filt(){let L=R.filter(r=>{if(st.s==='act'&&OFF.includes(r.Status))return false;if(st.s==='off'&&!OFF.includes(r.Status))return false;if(st.s==='ben'&&!BEN.includes(r.Status))return false;if(st.s==='goran'&&!GOR.includes(r.Status))return false;
  if(st.p!=='all'&&r.Prioriteit!==st.p)return false;if(st.w==='none'&&!noSite(r))return false;if(st.w==='site'&&noSite(r))return false;if(st.w==='sig'&&!freshSig(r))return false;
  if(st.q&&!JSON.stringify([r.Bedrijf,r.Locatie,r.Branche,r.Beslisser,r._domain,r['Zakelijke aanleiding'],r.Status]).toLowerCase().includes(st.q))return false;return true});
 const S={rec:(a,b)=>date(b).localeCompare(date(a)),audit:(a,b)=>(a['Audit score']??999)-(b['Audit score']??999),score:(a,b)=>((b['Score Zoë']??b['Score Lucas']??0)-(a['Score Zoë']??a['Score Lucas']??0)),rating:(a,b)=>(b['Google rating']??0)-(a['Google rating']??0)||(b['Aantal reviews']??0)-(a['Aantal reviews']??0),name:(a,b)=>a.Bedrijf.localeCompare(b.Bedrijf,'nl')};
 return L.sort(S[st.sort])}
const ini=n=>esc((n||'?').replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase());
const logo=r=>r._logo?`<img class="logo" src="${r._logo}" alt="">`:`<div class="logo">${ini(r.Bedrijf)}</div>`;
function badges(r){let h=stBadge(r.Status);if(r.Prioriteit)h+=`<span class="b ${r.Prioriteit==='A'?'red':r.Prioriteit==='B'?'orange':''}">Prio ${r.Prioriteit}</span>`;if(noSite(r))h+='<span class="b red">Geen website</span>';if(freshSig(r))h+='<span class="b acc">Nieuw signaal</span>';if(r.Route)h+=`<span class="b">Route ${esc(r.Route)}</span>`;if(r['Advies Zoë'])h+=`<span class="b ${r['Advies Zoë']==='BENADEREN'?'green':''}">Zoë: ${esc(r['Advies Zoë'])}</span>`;return h}
function thumb(r){if(noSite(r)||!r._shot){if(noSite(r)){const g=r['Google rating'];return `<div class="nosite">${g!=null?`<div class="big">${String(g).replace('.',',')}</div>${stars(g)}<div class="rv">${r['Aantal reviews']!=null?r['Aantal reviews']+' reviews':''}</div>`:`<div class="rv">${r['Aantal reviews']!=null?r['Aantal reviews']+' reviews':'Rating nog onbekend'}</div>`}<div class="none">Geen website${r['Heeft website']&&r['Heeft website']!=='Nee'?' · '+esc(r['Heeft website']):''}</div></div>`}
  return `<div class="ph">${r._domain?'Screenshot volgt':'Geen website opgegeven'}</div>`}
 return `<img loading="lazy" src="${r._shot}" alt="Huidige website ${esc(r._domain)}">${r['Audit score']!=null?`<div class="score">${ring(r['Audit score'])}<b>${r['Audit score']}</b></div>`:''}`}
function render(){const L=filt();$('cnt').textContent=`${L.length} van ${R.length}`;
 if(!L.length){$('list').innerHTML='<div class="empty">Geen prospects voor deze filters.</div>';return}
 if(st.v==='c'){$('list').innerHTML='<div class="grid">'+L.map((r,i)=>`<article class="card" data-i="${R.indexOf(r)}" style="animation-delay:${Math.min(i,20)*25}ms"><div class="thumb">${thumb(r)}</div><div class="cb"><div class="ct">${logo(r)}<div style="min-width:0"><h3>${esc(r.Bedrijf)}</h3><div class="sub">${esc([r.Locatie&&r.Locatie.split(/[(,]/)[0].trim(),r.Branche].filter(Boolean).join(' · '))}</div></div></div><div class="badges">${badges(r)}</div>${r['Zakelijke aanleiding']||r['Conclusie Lucas']?`<p class="why">${esc(r['Laatste signaal']||r['Zakelijke aanleiding']||r['Conclusie Lucas'])}</p>`:''}${SUBS.some(([k])=>r[k]!=null)?`<div class="subs">${SUBS.map(([k,l])=>`<div class="sb"><i><span style="width:${(r[k]??0)*10}%;background:${col10(r[k])}"></span></i>${l}</div>`).join('')}</div>`:''}</div></article>`).join('')+'</div>'}
 else{$('list').innerHTML=`<div class="tbl"><table><thead><tr><th></th><th>Bedrijf</th><th>Status</th><th>Prio</th><th>Audit</th><th>Rating</th><th>Plaats</th><th>Branche</th><th>Score</th><th>Datum</th></tr></thead><tbody>${L.map(r=>`<tr data-i="${R.indexOf(r)}"><td>${r._shot?`<img class="tthumb" loading="lazy" src="${r._shot}" alt="">`:`<div class="tthumb" style="display:grid;place-items:center;font-size:10px;color:var(--ink3)">${noSite(r)?'geen site':'–'}</div>`}</td><td><b>${esc(r.Bedrijf)}</b>${noSite(r)?' <span class="b red">Geen website</span>':''}</td><td>${stBadge(r.Status)}</td><td>${esc(r.Prioriteit||'')}</td><td>${r['Audit score']!=null?`<b style="color:${col(r['Audit score'])}">${r['Audit score']}</b>`:'<span style="color:var(--ink3)">–</span>'}</td><td>${r['Google rating']!=null?`${stars(r['Google rating'])} ${String(r['Google rating']).replace('.',',')}`:''}${r['Aantal reviews']!=null?` <span style="color:var(--ink2)">(${r['Aantal reviews']})</span>`:''}</td><td>${esc((r.Locatie||'').split(/[(,]/)[0])}</td><td>${esc(r.Branche||'')}</td><td>${r['Score Zoë']??r['Score Lucas']??''}</td><td style="white-space:nowrap">${fmt(date(r))}</td></tr>`).join('')}</tbody></table></div>`}
 document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>open_(R[+e.dataset.i]))}
const link=u=>{u=String(u);return /^https?:\/\//.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a>`:esc(u)};
const linkify=s=>esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`).replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u.replace(/^https?:\/\/(www\.)?/,'').slice(0,50)}</a>`).replace(/&lt;br&gt;/g,'\n');
function kv(r,keys){const rows=keys.filter(([k])=>r[k]!=null&&r[k]!=='').map(([k,l,t])=>`<dt>${l||k}</dt><dd>${t==='url'?link(r[k]):t==='date'?fmt(r[k]):t==='bool'?(r[k]?'Ja':'Nee'):linkify(r[k])}</dd>`).join('');return rows?`<dl class="kv">${rows}</dl>`:''}
function txt(r,keys){return keys.filter(k=>r[k]).map(k=>`<h5>${k}</h5><p class="txt">${linkify(r[k])}</p>`).join('')}
function open_(r){const a=r['Audit score'];let h='';
 h+=`<div class="dshot">${r._shot&&!noSite(r)?`<img src="${r._shot}" alt="">`:`<div style="aspect-ratio:16/10;position:relative">${thumb(r)}</div>`}</div>`;
 h+=`<div class="ct" style="margin-bottom:6px">${logo(r)}<div><h2>${esc(r.Bedrijf)}</h2></div></div><div class="sub">${esc([r.Locatie,r.Branche].filter(Boolean).join(' · '))}</div><div class="badges">${badges(r)}</div>`;
 h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${r._domain?`<a class="nl" href="https://${esc(r._domain)}" target="_blank" rel="noopener noreferrer">Website ↗</a>`:''}${r['Google Maps-link']?`<a class="nl g" href="${esc(r['Google Maps-link'])}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>`:''}${r.url?`<a class="nl g" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open in Notion ↗</a>`:''}</div>`;
 h+=`<div class="sec"><h4>Website-audit</h4>${a!=null||SUBS.some(([k])=>r[k]!=null)?`<div class="audit"><div class="ring">${ring(a,84,7)}<b>${a??'–'}</b></div><div class="bars">${SUBS.map(([k,l])=>`<div class="bar"><span>${l}</span><i><span style="width:${(r[k]??0)*10}%;background:${col10(r[k])}"></span></i><b>${r[k]??'–'}</b></div>`).join('')}</div></div>`:`<p class="txt" style="color:var(--ink2)">${noSite(r)?'Geen website om te auditen.':'Audit volgt door GO 4IT Website-audit.'}</p>`}${kv(r,[['HTTPS','HTTPS','bool'],['CMS/techniek'],['Audit datum',null,'date'],['_shotDate','Screenshot van','date']])}${txt(r,['Audit samenvatting','Digitale observatie'])}</div>`;
 if(r['Google rating']!=null||r['Aantal reviews']!=null||r['Heeft website'])h+=`<div class="sec"><h4>Google-reputatie</h4>${r['Google rating']!=null?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b style="font-size:28px">${String(r['Google rating']).replace('.',',')}</b>${stars(r['Google rating'])}<span style="color:var(--ink2)">${r['Aantal reviews']??''} reviews</span></div>`:''}${kv(r,[['Aantal reviews'],['Heeft website'],['Google Maps-link','Maps','url']])}</div>`;
 h+=`<div class="sec"><h4>Aanleiding & signaal</h4>${kv(r,[['Type aanleiding'],['Datum aanleiding',null,'date'],['Bron aanleiding',null,'url'],['Laatste signaal'],['Datum laatste signaal',null,'date']])}${txt(r,['Zakelijke aanleiding','Hypothese'])}</div>`;
 h+=`<div class="sec"><h4>Bedrijf & beslisser</h4>${kv(r,[['Beslisser'],['Functie'],['Bewijslink beslisser','Bewijs','url'],['Openbare contactroute','Contact'],['KvK'],['Bedrijfsgrootte','Grootte'],['Bron bedrijfsgrootte','Bron grootte'],['Website',null,'url'],['Gecontroleerde pagina',null,'url']])}</div>`;
 h+=`<div class="sec"><h4>Beoordeling team</h4>${kv(r,[['Route'],['Score Lucas'],['Score Zoë'],['Advies Zoë'],['Onderzoeksdatum',null,'date'],['Datum verdieping Zoë',null,'date']])}${txt(r,['Conclusie Lucas','Score-onderbouwing','Correctie Sjef',"Risico's en onzekerheden"])}</div>`;
 if(r.Conceptbericht)h+=`<div class="sec"><h4>Conceptbericht (niet verstuurd)</h4><p class="txt">${linkify(r.Conceptbericht)}</p></div>`;
 if(r['Datum benaderd']||r.Kanaal||r['Resultaat notitie'])h+=`<div class="sec"><h4>Contact</h4>${kv(r,[['Datum benaderd',null,'date'],['Kanaal'],['Resultaat notitie','Resultaat']])}</div>`;
 $('dcon').innerHTML=h;$('dr').scrollTop=0;$('dr').classList.add('on');$('ov').classList.add('on');$('dr').setAttribute('aria-hidden','false')}
const close_=()=>{$('dr').classList.remove('on');$('ov').classList.remove('on');$('dr').setAttribute('aria-hidden','true')};$('dx').onclick=close_;$('ov').onclick=close_;
addEventListener('keydown',e=>{if(e.key==='Escape')close_();if(e.key==='/'&&document.activeElement!==$('q')&&!$('app').classList.contains('hidden')){e.preventDefault();$('q').focus()}});
function md(s){const il=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
 const L=s.split('\n');let h='',i=0;while(i<L.length){let l=L[i];
  if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;h+=`<h${n}>${il(l.slice(n+1))}</h${n}>`;i++;continue}
  if(l.startsWith('|')){const rows=[];while(i<L.length&&L[i].startsWith('|')){rows.push(L[i]);i++}const c=x=>x.split('|').slice(1,-1).map(y=>y.trim());
   h+='<div style="overflow:auto"><table><thead><tr>'+c(rows[0]).map(x=>`<th>${il(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(2).map(r=>'<tr>'+c(r).map(x=>`<td>${il(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';continue}
  if(/^- /.test(l)){h+='<ul>';while(i<L.length&&/^- /.test(L[i])){h+=`<li>${il(L[i].slice(2))}</li>`;i++}h+='</ul>';continue}
  if(/^\d+\. /.test(l)){h+='<ol>';while(i<L.length&&/^\d+\. /.test(L[i])){h+=`<li>${il(L[i].replace(/^\d+\. /,''))}</li>`;i++}h+='</ol>';continue}
  if(l.trim())h+=`<p>${il(l)}</p>`;i++}return h}
const saved=sessionStorage.getItem('g4');if(saved){$('lb').innerHTML='<span class="spin"></span>';decrypt(saved).then(start).catch(()=>{sessionStorage.removeItem('g4');$('lb').innerHTML='→'})}
</script></body></html>
